name: Update cask

# Every release of Vidi publishes latest.json to R2; this follows it. The schedule is
# what makes it need no credential from the Vidi repository: the tap updates itself
# with its own GITHUB_TOKEN.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Point the cask at the latest release
        run: node .github/scripts/update-cask.mjs
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "vidi $(grep -o 'version "[^"]*"' Casks/vidi.rb | cut -d'"' -f2)"
          git push
          # A push made with GITHUB_TOKEN starts no workflows, so the check on the new
          # cask is asked for directly; a dispatch is the one event that token may raise.
          gh workflow run check.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
